version: "3.9"

services:
    postgres:
        image: postgres:16
        container_name: attendance_postgres
        restart: always
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "${DB_PORT}:{DB_INTERNAL_PORT}"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - attendance_net

    app:
        build: .
        container_name: attendance_app
        restart: always
        depends_on:
             - postgres
        env_file:
            - .env
        ports:
            - "${APP_PORT}:${APP_INTERNAL_PORT}"
        networks:
            - attendance_net

volumes:
    postgres_data:

networks:
    attendance_net: