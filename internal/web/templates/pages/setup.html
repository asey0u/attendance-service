{{define "content"}}
<div class="w-full max-w-md">

  <div class="mb-8 flex items-center gap-3">
    <span class="grid h-12 w-12 place-items-center rounded-xl bg-emerald-600 text-white font-mono font-bold text-xl shadow-lg shadow-emerald-200">У</span>
    <div>
      <div class="text-xl font-bold tracking-tight text-slate-900">Учёт посещаемости</div>
      <div class="text-[11px] uppercase tracking-[0.2em] text-slate-400 font-mono">первый запуск</div>
    </div>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/60">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Создание администратора</h1>
    <p class="mt-1 text-sm text-slate-500">Придумайте логин и пароль для главного аккаунта. Это делается один раз.</p>

    {{if .Error}}
      <div class="mt-5 flex items-start gap-2.5 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3">
        <svg class="mt-0.5 h-4 w-4 flex-shrink-0 text-rose-500" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9 9V5a1 1 0 112 0v4a1 1 0 11-2 0zm1 4a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd"/>
        </svg>
        <span class="text-sm text-rose-700">{{.Error}}</span>
      </div>
    {{end}}

    <form method="post" action="/setup" class="mt-6 space-y-4">
      <label class="block">
        <span class="text-[11px] font-semibold uppercase tracking-[0.15em] text-slate-500">Логин</span>
        <input name="login" type="text" required autocomplete="username" autofocus
               minlength="3"
               class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 shadow-sm
                      focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 transition
                      {{if .Error}}border-rose-300 bg-rose-50{{end}}">
        <span class="mt-1 block text-xs text-slate-400">Не менее 3 символов</span>
      </label>

      <label class="block">
        <span class="text-[11px] font-semibold uppercase tracking-[0.15em] text-slate-500">Пароль</span>
        <input name="password" type="password" required autocomplete="new-password"
               minlength="6"
               class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 shadow-sm
                      focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 transition
                      {{if .Error}}border-rose-300 bg-rose-50{{end}}">
        <span class="mt-1 block text-xs text-slate-400">Не менее 6 символов</span>
      </label>

      <button class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-semibold text-white shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 transition">
        Создать администратора →
      </button>
    </form>
  </div>

  <p class="mt-6 text-center text-xs text-slate-400">
    После создания аккаунта эта страница станет недоступна.
  </p>
</div>
{{end}}
