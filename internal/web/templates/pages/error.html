{{define "content"}}
<div class="mx-auto max-w-md text-center">
  <div class="rounded-2xl border border-slate-200 bg-white p-10 shadow-xl shadow-slate-200/60">
    <div class="font-mono text-6xl font-bold text-emerald-600">{{.Code}}</div>
    <h1 class="mt-3 text-xl font-bold tracking-tight text-slate-900">{{.Title}}</h1>
    <p class="mt-2 text-slate-500">{{.Message}}</p>
    <a href="/" class="mt-6 inline-flex rounded-lg bg-emerald-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-emerald-700 shadow-sm transition">
      На главную →
    </a>
  </div>
</div>
{{end}}
