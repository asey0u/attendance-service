{{define "content"}}
<header class="mb-8">
  <div class="text-[11px] font-semibold uppercase tracking-[0.2em] text-emerald-500 font-mono">Администрирование</div>
  <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">Сотрудники</h1>
  <p class="mt-1 text-slate-500">Управление профилями и привязка к отделам</p>
</header>

<section class="grid gap-6 md:grid-cols-3">

  <div class="md:col-span-1">
    <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
      <div class="border-b border-slate-100 bg-slate-50 px-5 py-3">
        <div class="text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-400 font-mono">Новый сотрудник</div>
      </div>
      <form method="post" action="/admin/employees" class="p-5 space-y-4 text-sm">
        <label class="block">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Имя</span>
          <input name="first_name" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
        </label>
        <label class="block">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Фамилия</span>
          <input name="last_name" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
        </label>
        <label class="block">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Должность</span>
          <input name="position" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
        </label>
        <label class="block">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Отдел</span>
          <select name="department_id" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm focus:border-emerald-500 focus:outline-none">
            <option value="">— не выбран —</option>
            {{range .Departments}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
          </select>
        </label>
        <button class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-semibold text-white shadow-sm hover:bg-emerald-700 transition">Создать</button>
      </form>
    </div>
  </div>

  <div class="md:col-span-2 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <table class="min-w-full divide-y divide-slate-100 text-sm">
      <thead class="bg-slate-50 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400">
        <tr>
          <th class="px-5 py-3">ФИО</th>
          <th class="px-5 py-3">Должность</th>
          <th class="px-5 py-3">Отдел</th>
          <th class="px-5 py-3 text-right">Действия</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        {{range .Rows}}
          <tr id="emp-{{.ID}}" class="hover:bg-slate-50">
            <td class="px-5 py-3 font-medium text-slate-900">{{.FirstName}} {{.LastName}}</td>
            <td class="px-5 py-3 text-slate-600">{{.Position}}</td>
            <td class="px-5 py-3">
              <form method="post" action="/admin/employees/{{.ID}}/department" class="inline-flex items-center gap-2">
                <select name="department_id" class="rounded-md border border-slate-300 px-2 py-1 text-xs text-slate-700 focus:border-emerald-400 focus:outline-none">
                  <option value="">— нет —</option>
                  {{- $cur := derefInt .DepartmentID -}}
                  {{- range $d := $.Departments -}}
                    <option value="{{$d.ID}}" {{if eq $d.ID $cur}}selected{{end}}>{{$d.Name}}</option>
                  {{- end -}}
                </select>
                <button class="rounded-md border border-slate-300 bg-white px-2 py-1 text-xs text-slate-600 hover:bg-slate-50 transition">OK</button>
              </form>
            </td>
            <td class="px-5 py-3 text-right">
              <button hx-delete="/admin/employees/{{.ID}}"
                      hx-target="#emp-{{.ID}}" hx-swap="outerHTML swap:200ms"
                      hx-confirm="Удалить {{.FirstName}} {{.LastName}}? Учётная запись тоже будет удалена."
                      class="rounded-md border border-slate-200 px-2.5 py-1 text-xs font-medium text-rose-600 hover:bg-rose-50 hover:border-rose-200 transition">Удалить</button>
            </td>
          </tr>
        {{end}}
      </tbody>
    </table>
    {{template "pagination" .}}
  </div>

</section>
{{end}}
